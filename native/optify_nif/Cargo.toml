[package]
name = "optify_nif"
version = "0.2.0"
edition = "2021"

[lib]
name = "optify_nif"
crate-type = ["cdylib"]

[dependencies]
optify = "0.20.5"
rustler = { version = "0.37", default-features = false, features = ["derive"] }
serde_json = "1"

[features]
default = ["nif_version_2_16"]
nif_version_2_16 = ["rustler/nif_version_2_16"]
