name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        shell: bash
        run: |
          version=$(tr -d '\n' < VERSION)
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true

  build_release:
    name: NIF ${{ matrix.job.target }}
    needs: create_release
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: aarch64-apple-darwin, os: macos-14, use-cross: false }
          - { target: x86_64-apple-darwin, os: macos-13, use-cross: false }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04, use-cross: true }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, use-cross: false }

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        shell: bash
        run: |
          version=$(tr -d '\n' < VERSION)
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Extract project version
        shell: bash
        run: |
          echo "PROJECT_VERSION=$(tr -d '\n' < VERSION)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.job.target }}

      - name: Build the project
        id: build-crate
        uses: philss/rustler-precompiled-action@v1.1.4
        with:
          project-name: optify_nif
          project-version: ${{ env.PROJECT_VERSION }}
          target: ${{ matrix.job.target }}
          nif-version: "2.16"
          use-cross: ${{ matrix.job.use-cross }}
          project-dir: native/optify_nif

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-crate.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path }}

      - name: Upload archive to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" "${{ steps.build-crate.outputs.file-path }}" --clobber

  publish:
    needs: build_release
    runs-on: ubuntu-latest
    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      MIX_ENV: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches VERSION
        shell: bash
        run: |
          version=$(tr -d '\n' < VERSION)
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Setup Elixir + Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.0-rc.2"
          otp-version: "28.1"
          version-type: strict

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests against release artifacts
        run: mix test

      - name: Build docs
        run: mix docs

      - name: Generate checksum file for all release artifacts
        run: mix rustler_precompiled.download Optify.Native --all --print

      - name: Build Hex package
        run: mix hex.build

      - name: Publish package
        run: mix hex.publish package --yes

      - name: Publish docs
        run: mix hex.publish docs --yes
