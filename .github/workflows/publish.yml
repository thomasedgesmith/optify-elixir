name: Publish

on:
  push:
    branches: ["main"]
    paths:
      - VERSION

permissions:
  contents: read

concurrency:
  group: publish-hex-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      MIX_ENV: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Elixir + Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.0-rc.2"
          otp-version: "28.1"
          version-type: strict

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Show release version
        run: |
          version=$(cat VERSION)
          echo "Publishing Optify ${version} from ${GITHUB_SHA}"

      - name: Run tests
        run: mix test

      - name: Build docs
        run: mix docs

      - name: Publish package and docs
        run: mix hex.publish --yes
